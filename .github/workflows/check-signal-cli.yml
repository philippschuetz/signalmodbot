name: Check signal-cli release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest signal-cli release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AsamK/signal-cli/releases/latest |
            jq -r '.tag_name')

          if [[ ! "$tag" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unexpected signal-cli release tag: $tag" >&2
            exit 1
          fi
          latest="${BASH_REMATCH[1]}"

          current=$(sed -n '1s/^ARG SIGNAL_CLI_VERSION=//p' Dockerfile)
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read a valid SIGNAL_CLI_VERSION from Dockerfile" >&2
            exit 1
          fi

          newest=$(printf '%s\n' "$current" "$latest" | sort -V | tail -n 1)
          if [[ "$latest" == "$current" || "$newest" != "$latest" ]]; then
            echo "No newer signal-cli release available (current: $current, latest: $latest)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "1s/^ARG SIGNAL_CLI_VERSION=.*/ARG SIGNAL_CLI_VERSION=${latest}/" Dockerfile
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.release.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-signal-cli
          delete-branch: true
          commit-message: "Update signal-cli to ${{ steps.release.outputs.version }}"
          title: "Update signal-cli to ${{ steps.release.outputs.version }}"
          body: |
            A new stable signal-cli release was detected.

            This updates the default version in the Dockerfile. Review the [release notes](https://github.com/AsamK/signal-cli/releases/tag/v${{ steps.release.outputs.version }}) before merging.
